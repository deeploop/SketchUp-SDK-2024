name: Build SketchUp SDK Samples

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ============================================================
  # Job 1: C/C++ samples (MSBuild on Windows)
  # ============================================================
  build-cpp:
    name: C++ Samples (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── GenerateCADModel ───────────────────────────────────────────────────
      - name: Build GenerateCADModel
        working-directory: samples/GenerateCADModel
        run: |
          msbuild GenerateCADModel.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Generate OfficeBuilding.skp (C++)
        working-directory: samples/GenerateCADModel/Release_x64
        run: .\GenerateCADModel.exe

      # ── WritingToAskpFile ──────────────────────────────────────────────────
      - name: Build WritingToAskpFile
        working-directory: samples/WritingToAskpFile
        run: |
          msbuild WritingToAskpFile.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run WritingToAskpFile
        working-directory: samples/WritingToAskpFile/Release_x64
        run: .\WritingToAskpFile.exe

      # ── ReadingFromAskpFile ────────────────────────────────────────────────
      - name: Build ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile
        run: |
          msbuild ReadingFromAskpFile.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile/Release_x64
        run: .\ReadingFromAskpFile.exe

      - name: Upload C++ generated SKP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-generated-skp
          path: |
            samples/GenerateCADModel/Release_x64/OfficeBuilding.skp
            samples/WritingToAskpFile/Release_x64/new_model.skp
          retention-days: 30

  # ============================================================
  # Job 2: Ruby API — call SketchUpAPI.dll directly via FFI
  # No bridge DLL needed: Windows x64 ABI makes SUxxxRef (struct { void* })
  # ABI-identical to uint64, so Ruby FFI can call the SDK directly.
  # ============================================================
  build-ruby:
    name: Ruby API → SKP (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Copy SDK DLLs into sdk-ruby/bin/ ──────────────────────────────────
      # Ruby's ffi_bindings.rb loads them from this directory.
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      # Verify the two SDK DLLs are present and loadable.
      - name: Verify sdk-ruby/bin/ DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      # ── Ruby setup ────────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Run example ───────────────────────────────────────────────────────
      # ffi_bindings.rb calls SetDllDirectoryA(BIN_DIR) via Fiddle so Windows
      # resolves SketchUpAPI.dll's transitive imports, then Fiddle.dlopen
      # pre-loads both SDK DLLs before FFI's ffi_lib call.
      - name: Generate RubyOfficeBuilding.skp
        working-directory: sdk-ruby/examples
        run: ruby generate_office.rb

      - name: Show file info
        working-directory: sdk-ruby/examples
        run: |
          dir RubyOfficeBuilding.skp
          Write-Host "SKP generated successfully via Ruby API"

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload Ruby-generated SKP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-generated-skp
          path: sdk-ruby/examples/RubyOfficeBuilding.skp
          retention-days: 30

  # ============================================================
  # Job 3: North Star door generator — JSON → 3D SKP
  # Phase A: pure-Ruby unit tests (no SDK, any platform)
  # Phase B: full 3D SKP generation (Windows, needs SketchUpAPI.dll)
  # ============================================================
  north-star-door:
    name: North Star Door Generator (JSON → SKP)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Phase A: pure-Ruby unit tests (no SDK required) ───────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Unit tests — parser, formulas, matrix transforms
        working-directory: sdk-ruby/examples/north_star_door
        run: ruby test_door_generator.rb --verbose

      # ── Copy SDK DLLs (needed for Phase B) ────────────────────────────────
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      - name: Verify SDK DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Phase B: generate NorthStarDoor.skp ───────────────────────────────
      - name: Generate NorthStarDoor.skp (JSON → 3D SKP)
        working-directory: sdk-ruby/examples/north_star_door
        run: ruby generate_door.rb

      - name: Show generated file info
        working-directory: sdk-ruby/examples/north_star_door
        run: |
          dir NorthStarDoor.skp
          Write-Host "North Star door SKP generated successfully"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload NorthStarDoor.skp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-star-door-skp
          path: sdk-ruby/examples/north_star_door/NorthStarDoor.skp
          retention-days: 30
