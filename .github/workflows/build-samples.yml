name: Build SketchUp SDK Samples

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ============================================================
  # Job 1: C/C++ samples (MSBuild on Windows)
  # ============================================================
  build-cpp:
    name: C++ Samples (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── GenerateCADModel ───────────────────────────────────────────────────
      - name: Build GenerateCADModel
        working-directory: samples/GenerateCADModel
        run: |
          msbuild GenerateCADModel.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Generate OfficeBuilding.skp (C++)
        working-directory: samples/GenerateCADModel/Release_x64
        run: .\GenerateCADModel.exe

      # ── WritingToAskpFile ──────────────────────────────────────────────────
      - name: Build WritingToAskpFile
        working-directory: samples/WritingToAskpFile
        run: |
          msbuild WritingToAskpFile.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run WritingToAskpFile
        working-directory: samples/WritingToAskpFile/Release_x64
        run: .\WritingToAskpFile.exe

      # ── ReadingFromAskpFile ────────────────────────────────────────────────
      - name: Build ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile
        run: |
          msbuild ReadingFromAskpFile.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile/Release_x64
        run: .\ReadingFromAskpFile.exe

      - name: Upload C++ generated SKP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-generated-skp
          path: |
            samples/GenerateCADModel/Release_x64/OfficeBuilding.skp
            samples/WritingToAskpFile/Release_x64/new_model.skp
          retention-days: 30

  # ============================================================
  # Job 2: Ruby API — build bridge DLL, then run Ruby script
  # ============================================================
  build-ruby:
    name: Ruby API → SKP (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Build SketchUpBridge.dll ───────────────────────────────────────────
      # Compiles the thin C++ bridge that wraps opaque SDK handles into plain
      # void* so Ruby FFI can call the SketchUp C API without struct-by-value issues.
      - name: Build SketchUpBridge.dll
        working-directory: sdk-ruby/ext/bridge
        run: |
          msbuild SketchUpBridge.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      # Confirm all DLLs landed in sdk-ruby/bin/ and can actually be loaded.
      # Uses LoadLibraryEx (single-line C# to avoid YAML/heredoc conflict).
      - name: Verify sdk-ruby/bin/ DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          Write-Host "=== sdk-ruby\bin ==="
          dir $binDir
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll","SketchUpBridge.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      # ── Ruby setup ────────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Run example ───────────────────────────────────────────────────────
      # ffi_bindings.rb uses Fiddle.dlopen to pre-load SketchUpCommonPreferences.dll
      # and SketchUpAPI.dll by absolute path before FFI calls LoadLibrary on the
      # bridge — this puts them in the process loaded-module list so Windows
      # resolves the bridge's imports without needing PATH tricks.
      - name: Generate RubyOfficeBuilding.skp
        working-directory: sdk-ruby/examples
        run: ruby generate_office.rb

      - name: Show file info
        working-directory: sdk-ruby/examples
        run: |
          dir RubyOfficeBuilding.skp
          Write-Host "SKP generated successfully via Ruby API"

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload Ruby-generated SKP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-generated-skp
          path: sdk-ruby/examples/RubyOfficeBuilding.skp
          retention-days: 30

      - name: Upload bridge DLL (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sketchup-bridge-dll
          path: sdk-ruby/bin/SketchUpBridge.dll
          retention-days: 7
