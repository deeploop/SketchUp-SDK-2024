name: Build SketchUp SDK Samples

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ============================================================
  # Job 1: C/C++ samples (MSBuild on Windows)
  # ============================================================
  build-cpp:
    name: C++ Samples (Windows x64)
    if: false
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── GenerateCADModel ───────────────────────────────────────────────────
      - name: Build GenerateCADModel
        working-directory: samples/GenerateCADModel
        run: |
          msbuild GenerateCADModel.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Generate OfficeBuilding.skp (C++)
        working-directory: samples/GenerateCADModel/Release_x64
        run: .\GenerateCADModel.exe

      # ── WritingToAskpFile ──────────────────────────────────────────────────
      - name: Build WritingToAskpFile
        working-directory: samples/WritingToAskpFile
        run: |
          msbuild WritingToAskpFile.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run WritingToAskpFile
        working-directory: samples/WritingToAskpFile/Release_x64
        run: .\WritingToAskpFile.exe

      # ── ReadingFromAskpFile ────────────────────────────────────────────────
      - name: Build ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile
        run: |
          msbuild ReadingFromAskpFile.sln `
            /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Run ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile/Release_x64
        run: .\ReadingFromAskpFile.exe

      - name: Upload C++ generated SKP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-generated-skp
          path: |
            samples/GenerateCADModel/Release_x64/OfficeBuilding.skp
            samples/WritingToAskpFile/Release_x64/new_model.skp
          retention-days: 30

  # ============================================================
  # Job 2: Ruby API — call SketchUpAPI.dll directly via FFI
  # No bridge DLL needed: Windows x64 ABI makes SUxxxRef (struct { void* })
  # ABI-identical to uint64, so Ruby FFI can call the SDK directly.
  # ============================================================
  build-ruby:
    name: Ruby API → SKP (Windows x64)
    if: false
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Copy SDK DLLs into sdk-ruby/bin/ ──────────────────────────────────
      # Ruby's ffi_bindings.rb loads them from this directory.
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      # Verify the two SDK DLLs are present and loadable.
      - name: Verify sdk-ruby/bin/ DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      # ── Ruby setup ────────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Run example ───────────────────────────────────────────────────────
      # ffi_bindings.rb calls SetDllDirectoryA(BIN_DIR) via Fiddle so Windows
      # resolves SketchUpAPI.dll's transitive imports, then Fiddle.dlopen
      # pre-loads both SDK DLLs before FFI's ffi_lib call.
      - name: Generate RubyOfficeBuilding.skp
        working-directory: sdk-ruby/examples
        run: ruby generate_office.rb

      - name: Show file info
        working-directory: sdk-ruby/examples
        run: |
          dir RubyOfficeBuilding.skp
          Write-Host "SKP generated successfully via Ruby API"

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload Ruby-generated SKP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-generated-skp
          path: sdk-ruby/examples/RubyOfficeBuilding.skp
          retention-days: 30

  # ============================================================
  # Job 3: North Star door generator — JSON → 3D SKP
  # Phase A: pure-Ruby unit tests (no SDK, any platform)
  # Phase B: full 3D SKP generation (Windows, needs SketchUpAPI.dll)
  # ============================================================
  north-star-door:
    name: North Star Door Generator (JSON → SKP)
    if: false
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Phase A: pure-Ruby unit tests (no SDK required) ───────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Unit tests — parser, formulas, matrix transforms
        working-directory: sdk-ruby/examples/north_star_door
        run: ruby test_door_generator.rb --verbose

      # ── Copy SDK DLLs (needed for Phase B) ────────────────────────────────
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      - name: Verify SDK DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Phase B: generate NorthStarDoor.skp ───────────────────────────────
      - name: Generate NorthStarDoor.skp (JSON → 3D SKP)
        working-directory: sdk-ruby/examples/north_star_door
        run: ruby generate_door.rb

      - name: Show generated file info
        working-directory: sdk-ruby/examples/north_star_door
        run: |
          dir NorthStarDoor.skp
          Write-Host "North Star door SKP generated successfully"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload NorthStarDoor.skp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-star-door-skp
          path: sdk-ruby/examples/north_star_door/NorthStarDoor.skp
          retention-days: 30

  # ============================================================
  # Job 4: North Star Advanced Door v2 — 4-panel folding with
  #         validation, milling markers and glass transparency
  # ============================================================
  north-star-door-v2:
    name: North Star Advanced Door v2 (JSON → SKP)
    if: false
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Phase A: pure-Ruby unit tests (validation + formulas, no SDK) ─────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Unit tests — validation, formulas, parser, matrix
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: ruby test_advanced_door.rb --verbose

      # ── Copy SDK DLLs (Phase B needs them) ────────────────────────────────
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      - name: Verify SDK DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Phase B: generate NorthStarFolding4Panel.skp ─────────────────────
      - name: Generate NorthStarFolding4Panel.skp (4-panel folding door)
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: ruby generate_advanced_door.rb

      - name: Show generated file info
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: |
          dir NorthStarFolding4Panel.skp
          Write-Host "4-panel folding door SKP generated successfully"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload NorthStarFolding4Panel.skp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-star-folding-4panel-skp
          path: sdk-ruby/examples/north_star_door_v2/NorthStarFolding4Panel.skp
          retention-days: 30

  # ============================================================
  # Job 5: DC-ready door SKP generation via C SDK
  #
  # What this CI job does:
  #   Phase A — pure-Ruby unit tests: verify JSON parsing, DC formula
  #             generators (ANIMATE strings, _onclick_formula keys, etc.)
  #   Phase B — C SDK via FFI: build static geometry + write DC attribute
  #             dictionaries into the SKP file via SUEntityGetAttributeDictionary
  #
  # What this CI job does NOT do:
  #   The ANIMATE engine, $dc_observers, and "Interact" tool only run
  #   inside SketchUp. To see the door animate open/close, open the
  #   generated SKP in SketchUp and use the Interact tool, OR run
  #   sketchup_console_dc_door.rb from SketchUp's Ruby Console.
  # ============================================================
  north-star-dc-door:
    name: North Star DC-ready SKP (C SDK writes DC attrs)
    if: false
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Phase A: pure-Ruby DC attribute unit tests ────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # Phase A: pure-Ruby — no SDK or SketchUp needed
      # Tests JSON formula generators, key names, ANIMATE strings
      - name: "Phase A: Unit tests — DC formula generators (pure Ruby, no SDK)"
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: ruby test_dc_attributes.rb --verbose

      # ── Copy SDK DLLs (Phase B: C SDK geometry + DC attr writing) ─────────
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      - name: Verify SDK DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Phase B: C SDK writes geometry + DC attribute dicts ───────────────
      # NOTE: ANIMATE/DC engine only activates inside SketchUp.
      # Open the generated SKP with the Interact tool to see animation,
      # or run sketchup_console_dc_door.rb from SketchUp's Ruby Console.
      - name: "Phase B: Generate pivot_door_instance_DC.skp (geometry + DC attrs)"
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: ruby generate_dc_door.rb pivot_door_instance.json

      - name: Show pivot DC file info
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: |
          dir pivot_door_instance_DC.skp
          Write-Host "Pivot DC-ready SKP written (open in SketchUp to animate)"

      - name: "Phase B: Generate sliding_door_instance_DC.skp (geometry + DC attrs)"
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: ruby generate_dc_door.rb sliding_door_instance.json

      - name: Show sliding DC file info
        working-directory: sdk-ruby/examples/north_star_door_v2
        run: |
          dir sliding_door_instance_DC.skp
          Write-Host "Sliding DC door generated successfully"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload DC door SKP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-star-dc-door-skp
          path: |
            sdk-ruby/examples/north_star_door_v2/pivot_door_instance_DC.skp
            sdk-ruby/examples/north_star_door_v2/sliding_door_instance_DC.skp
          retention-days: 30

  # ============================================================
  # Job 6: North Star v3 — Q-Series / LS-Folding / F1-Cabinet
  # Phase A: pure-Ruby tests (formulas, validation, DC attrs)
  # Phase B: C SDK generates grouped SKP for all 3 product lines
  #
  # Group hierarchy per panel:
  #   Group "NorthStar_{system}_P{n}" (DC attrs on entity)
  #     ├── Frame geometry  (LS profile: fw=16/22.5/33mm)
  #     ├── Glass geometry  (5mm, with transparency)
  #     └── Milling marker  (F1 only: 3.5mm×10mm hinge slot, red)
  #
  # Deduction formulas:
  #   Suspended/Folding: H_panel = H - 47(top) - 17(bottom)
  #   Pivot/F1:          H_panel = H - 16(top) - 15(bottom)
  #   Folding:           W_panel = (L - 14) / N
  #   Pivot:             W_panel = L - 14
  # ============================================================
  north-star-v3:
    name: North Star v3 (Q-Series / LS-Folding / F1-Cabinet)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Phase A: pure-Ruby formula tests ─────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: "Phase A: Unit tests — v3 formulas, validation, DC attrs (pure Ruby)"
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: ruby test_door_logic_v3.rb --verbose

      # ── Copy SDK DLLs ─────────────────────────────────────────────────────
      - name: Copy SDK DLLs to sdk-ruby/bin/
        run: |
          New-Item -ItemType Directory -Force -Path sdk-ruby\bin | Out-Null
          Copy-Item binaries\sketchup\x64\*.dll sdk-ruby\bin\
          Write-Host "=== sdk-ruby\bin\ ==="
          dir sdk-ruby\bin\

      - name: Verify SDK DLL loadability
        run: |
          $cs = 'using System; using System.Runtime.InteropServices; public class NL { [DllImport("kernel32",SetLastError=true)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint d); }'
          Add-Type -TypeDefinition $cs
          $binDir = (Resolve-Path "sdk-ruby\bin").Path
          foreach ($dll in @("SketchUpCommonPreferences.dll","SketchUpAPI.dll")) {
            $full = Join-Path $binDir $dll
            if (-not (Test-Path $full)) { throw "MISSING: $dll" }
            $h = [NL]::LoadLibraryEx($full, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "LoadLibraryEx FAILED: $dll  Win32Error=$err"
            }
            Write-Host "LOADABLE: $dll"
          }
          Write-Host "All DLLs OK"

      - name: Install ffi gem
        working-directory: sdk-ruby
        run: gem install ffi --no-document

      # ── Phase B: Q-Series (3-panel sync-sliding, master/slave DC) ─────────
      - name: "Phase B: Generate Q-Series SKP (Sync_Sliding, 3 panels, master/slave DC)"
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: ruby generate_northstar.rb q_series_instance.json

      - name: Show Q-Series file info
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: |
          dir q_series_instance.skp
          Write-Host "Q-Series 3-panel sync-sliding generated"

      # ── Phase B: LS-Folding (4-panel folding, (L-14)/N width) ────────────
      - name: "Phase B: Generate LS-Folding SKP (Folding, 4 panels, (L-14)/N formula)"
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: ruby generate_northstar.rb ls_folding_instance.json

      - name: Show LS-Folding file info
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: |
          dir ls_folding_instance.skp
          Write-Host "LS-Folding 4-panel generated"

      # ── Phase B: F1-Cabinet (pivot, ≤450mm, milling marker) ───────────────
      - name: "Phase B: Generate F1-Cabinet SKP (Pivot, 440x2000, F1 hinge milling)"
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: ruby generate_northstar.rb f1_cabinet_instance.json

      - name: Show F1-Cabinet file info
        working-directory: sdk-ruby/examples/north_star_door_v3
        run: |
          dir f1_cabinet_instance.skp
          Write-Host "F1-Cabinet pivot door with hinge milling generated"

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload v3 SKP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-star-v3-skp
          path: |
            sdk-ruby/examples/north_star_door_v3/q_series_instance.skp
            sdk-ruby/examples/north_star_door_v3/ls_folding_instance.skp
            sdk-ruby/examples/north_star_door_v3/f1_cabinet_instance.skp
          retention-days: 30
