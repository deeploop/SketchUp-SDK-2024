name: Build SketchUp SDK Samples

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Run Samples (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── GenerateCADModel ─────────────────────────────────────────────────
      - name: Build GenerateCADModel
        working-directory: samples/GenerateCADModel
        run: |
          msbuild GenerateCADModel.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /nologo

      - name: Generate OfficeBuilding.skp
        working-directory: samples/GenerateCADModel/Release_x64
        run: .\GenerateCADModel.exe

      # ── WritingToAskpFile ────────────────────────────────────────────────
      - name: Build WritingToAskpFile
        working-directory: samples/WritingToAskpFile
        run: |
          msbuild WritingToAskpFile.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /nologo

      - name: Run WritingToAskpFile
        working-directory: samples/WritingToAskpFile/Release_x64
        run: .\WritingToAskpFile.exe

      # ── ReadingFromAskpFile ──────────────────────────────────────────────
      - name: Build ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile
        run: |
          msbuild ReadingFromAskpFile.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /nologo

      - name: Run ReadingFromAskpFile
        working-directory: samples/ReadingFromAskpFile/Release_x64
        run: .\ReadingFromAskpFile.exe

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload generated SKP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-skp-files
          path: |
            samples/GenerateCADModel/Release_x64/OfficeBuilding.skp
            samples/WritingToAskpFile/Release_x64/new_model.skp
          retention-days: 30

      - name: Upload executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-sample-executables
          path: |
            samples/GenerateCADModel/Release_x64/GenerateCADModel.exe
            samples/WritingToAskpFile/Release_x64/WritingToAskpFile.exe
            samples/ReadingFromAskpFile/Release_x64/ReadingFromAskpFile.exe
          retention-days: 7
